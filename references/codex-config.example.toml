# Merge only the settings you need into your existing Codex configuration.
# Pitcrew preserves these caller-owned policies and never widens them.

sandbox_mode = "workspace-write"
approval_policy = "on-request"

# Provider connectors are optional. Configure Linear only for projects whose
# config.json sets providers.tracker = "linear".
#
# [mcp_servers.linear]
# command = "npx"
# args = ["-y", "mcp-remote", "https://mcp.linear.app/mcp"]

# Prefer a dedicated profile for scheduled Pitcrew passes so its permissions are
# explicit and reviewable. Keep network access scoped to roles that require a
# configured remote provider.
#
# [profiles.pitcrew]
# sandbox_mode = "workspace-write"
# approval_policy = "on-request"
